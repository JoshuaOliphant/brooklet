name: publish
on:
  release:
    types: [published]
  # SmolForge does not recognise the `release` event. A workflow whose events it
  # recognises none of falls back to push-on-default-branch, which made Forge run
  # this publish workflow on every push to main. Declaring an event Forge does
  # know stops that fallback; GitHub treats it as an added manual trigger and the
  # release trigger above is unaffected.
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
